# Default values for the vizdiff chart.
# This file documents every supported value. Override with -f myvalues.yaml
# or --set on the helm command line.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Fully override the release-derived resource name prefix.
fullnameOverride: ""

# Container images. Tags default to the chart appVersion when left empty,
# so a single `appVersion` bump (or `--set image.tag=<sha>` from CI) moves
# all three services together. Set image.<svc>.tag to pin a service.
image:
  # -- Registry + namespace prefix applied to every repository below,
  # e.g. "registry.gitlab.com/vizdiff-io/vizdiff.io". Leave empty to use bare repos.
  registry: "ghcr.io/vizdiff-io"
  # -- Global tag fallback. Empty => use .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent
  api:
    repository: vizdiff-api
    tag: ""
  worker:
    repository: vizdiff-worker
    tag: ""
  frontend:
    repository: vizdiff-frontend
    tag: ""

# -- Names of pre-existing image pull secrets (e.g. for a private registry).
imagePullSecrets: []
#  - name: gitlab-registry

# Per-service replica counts.
replicaCount:
  api: 1
  worker: 1
  frontend: 1

# -- Public URL the deployment is served from. Used by the api (APP_URL),
# the OIDC redirect default, and the frontend runtime config. REQUIRED.
appUrl: "https://vizdiff.example.com"

# Authentication. See NOTES.txt and docs/CONFIGURATION.md.
auth:
  # -- "oidc" (production / MSAL / generic IdP) or "dev" (no-auth, non-prod only).
  provider: oidc
  oidc:
    # -- Issuer URL, e.g. https://login.microsoftonline.com/<tenant>/v2.0
    issuer: ""
    clientId: ""
    # -- OIDC client secret. Stored in the chart Secret (see secrets.*) unless
    # provided via an existing secret.
    clientSecret: ""
    # -- Defaults to "${appUrl}/api/auth/callback" when empty.
    redirectUri: ""
    scopes: "openid profile email"

# GitHub support. Disabled by default; GitLab is the focus.
github:
  enabled: false

# GitLab per-host service tokens. The JSON value is stored in the Secret as
# GITLAB_HOSTS. Example:
#   gitlab:
#     hosts:
#       - host: https://gitlab.com
#         token: glpat-xxxx
#         rejectUnauthorized: true
#       - host: https://gitlab.corp.example.com
#         token: glpat-yyyy
#         rejectUnauthorized: false
#         webhookSecret: shhh
gitlab:
  hosts: []
  # -- Optional: reference an existing Secret holding the GITLAB_HOSTS key
  # instead of rendering tokens into chart-managed Secrets. Takes precedence
  # over .gitlab.hosts when set.
  hostsSecret:
    name: ""
    key: GITLAB_HOSTS
  # -- Single global webhook secret (used when per-host webhookSecret is unset).
  webhookSecret: ""

# Secret handling.
secrets:
  # -- When true (default) the chart renders a Secret from the values below.
  # When false you MUST provide secrets.existingSecret with all required keys.
  create: true
  # -- Name of a pre-existing Secret to consume via envFrom instead of creating one.
  existingSecret: ""
  # -- JWT signing secret. REQUIRED in production; generate a unique 32+ char value.
  jwtSecret: ""

# Postgres connection. When postgres.embedded is true, host/port/user/password
# are wired to the in-chart Postgres and these external values are ignored.
postgres:
  # -- Deploy an in-chart single-replica Postgres (StatefulSet) for standalone/
  # air-gapped trials. NOT for production; use RDS (Terragrunt) instead.
  embedded: false
  host: ""
  port: 5432
  database: vizdiff
  user: postgres
  # -- Password. Stored in the chart Secret as POSTGRES_PASS.
  password: ""
  embeddedConfig:
    image: postgres:16-alpine
    storage: 8Gi
    storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

# Object storage (screenshots/artifacts).
s3:
  bucketName: "vizdiff"
  region: "us-west-2"
  # -- Custom S3 endpoint (for MinIO / non-AWS). Empty => AWS default.
  endpoint: ""
  # -- Path-style addressing, required by MinIO and most S3-compatibles.
  forcePathStyle: false
  # -- Deploy an in-chart MinIO for standalone/air-gapped trials. When true,
  # endpoint/forcePathStyle/credentials are wired automatically.
  minio:
    enabled: false
    image: minio/minio:latest
    accessKey: minioadmin
    secretKey: minioadmin
    storage: 16Gi
    storageClassName: ""

# -- ENABLE_VCS_STATUS: post commit/MR statuses to VCS. Defaults to "true" so
# self-hosted prod posts statuses; set false to disable.
enableVcsStatus: true

serviceAccount:
  # -- Create a ServiceAccount for the api/worker pods.
  create: true
  name: ""
  annotations: {}
    # IRSA: grant the pods an IAM role for S3 access. Terragrunt's irsa module
    # fills this in. Example:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vizdiff-s3

# Service definitions (api + frontend have inbound Services; worker does not).
service:
  api:
    type: ClusterIP
    port: 3001
  frontend:
    type: ClusterIP
    port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  # -- Hostname. Defaults to the host parsed from appUrl when empty.
  host: ""
  tls:
    enabled: false
    secretName: vizdiff-tls
  paths:
    frontend: /
    api: /api

# Worker rendering options.
worker:
  # -- Opt-in software (SwiftShader) WebGL for story rendering (issue #447). Off by default
  # because SwiftShader is in-process software rasterization driven by untrusted story content.
  # Enable for Storybooks with WebGL components (maplibre-gl, deck.gl, three.js, ...).
  enableWebgl: false
  # -- Whitespace-separated extra Chrome flags appended to the worker's screenshot sessions,
  # after the hardening and WebGL flags (WORKER_CHROME_EXTRA_ARGS).
  chromeExtraArgs: ""
  # -- Upper bound (ms) on the best-effort "fail the build + post the failed VCS status" work
  # that runs before the worker's fatal exit on a wedged render (issue #451,
  # WORKER_FATAL_FAILSAFE_TIMEOUT_MS). Empty uses the built-in default (5000).
  fatalFailsafeTimeoutMs: ""
  # -- Maximum number of times a task may be claimed before the startup orphan reclaim fails the
  # build instead of requeueing it (issue #451, WORKER_MAX_TASK_ATTEMPTS). Empty uses the
  # built-in default (3).
  maxTaskAttempts: ""
  # -- Task-queue claim lock expiry in minutes (WORKER_TASK_LOCK_TIMEOUT_MINUTES). Live owners
  # refresh the lock every minute (task-lock heartbeat), so expiry only reclaims tasks from
  # workers that died without releasing (SIGKILL/OOM). Keep it below the effective stuck-running
  # threshold (max(stuckRunningMinutes, 3 x WORKER_PROGRESS_TIMEOUT_MS)) so an orphaned render
  # chunk is reclaimed before the stuck-build sweeper fails the whole build. Empty uses the
  # built-in default (10).
  taskLockTimeoutMinutes: ""
  # -- Stuck-build sweeper threshold (minutes) for "running" builds (issue #451,
  # WORKER_STUCK_RUNNING_MINUTES). Empty uses the built-in default (15).
  stuckRunningMinutes: ""
  # -- Stuck-build sweeper threshold (minutes) for "pending" builds (issue #451,
  # WORKER_STUCK_PENDING_MINUTES). Empty uses the built-in default (240).
  stuckPendingMinutes: ""
  # -- Per-story render timeout in ms (WORKER_STORY_RENDER_TIMEOUT_MS, issue #458). After
  # navigation the worker waits for Storybook's story-render lifecycle to complete before
  # capturing; a story that never completes is marked failed. Empty uses the default (30000).
  storyRenderTimeoutMs: ""
  # -- Cap in ms on a story's opt-in pre-capture delay, parameters.vizdiff.delay /
  # parameters.chromatic.delay (WORKER_STORY_DELAY_MAX_MS). Empty uses the default (15000).
  storyDelayMaxMs: ""
  # -- Recycle each pooled Chrome session after this many rendered stories to bound cumulative
  # memory growth over long builds (issue #453, WORKER_SESSION_RECYCLE_STORIES). "0" disables
  # recycling. Empty uses the built-in default (150).
  sessionRecycleStories: ""
  # -- Timeout in ms for the between-stories browser-session health probe that detects a dead
  # (e.g. OOM-killed) Chrome session so it can be replaced (issue #450,
  # WORKER_SESSION_PROBE_TIMEOUT_MS). Empty uses the built-in default (5000).
  sessionProbeTimeoutMs: ""
  # -- Replace a pooled session after this many consecutive infrastructure-classified story
  # failures (issue #450, WORKER_SESSION_MAX_INFRA_FAILURES). Empty uses the built-in default (2).
  sessionMaxInfraFailures: ""
  # -- Maximum render attempts per story; infra-classified failures are retried on a healthy
  # session before being recorded (issue #454, WORKER_STORY_MAX_ATTEMPTS). Empty uses the
  # built-in default (2).
  storyMaxAttempts: ""
  # -- Number of per-story finalize tasks (S3 screenshot/diff uploads, baseline diff, DB save)
  # processed concurrently in the background after capture releases its browser session
  # (issue #456, WORKER_FINALIZE_CONCURRENCY). Empty uses the built-in default (4).
  finalizeConcurrency: ""
  # -- Cap on stories captured but not yet finalized; each buffers one screenshot PNG in memory,
  # and the next capture waits once the backlog hits this limit (issue #456,
  # WORKER_FINALIZE_QUEUE_LIMIT). Empty uses the built-in default (16).
  finalizeQueueLimit: ""
  # -- Interval in ms between screenshots in the visual-stabilization loop (issue #456,
  # WORKER_STABILIZE_INTERVAL_MS). Empty uses the built-in default (250; previously a hardcoded
  # 500 — raise it back for storybooks with slow animations).
  stabilizeIntervalMs: ""
  # -- Settle delay in ms after the post-stabilization viewport resize before the final
  # full-height screenshot (issue #456, WORKER_POST_LOAD_DELAY_MS). Empty uses the built-in
  # default (250).
  postLoadDelayMs: ""
  # -- In-place story switching (issue #474, WORKER_INPLACE_STORY_SWITCHING): navigate each
  # pooled browser session once, then switch stories via the Storybook preview channel instead of
  # a full page navigation per story (bundle re-parse, provider boot, fonts, and CSS injection
  # become once-per-document). Hard navigation remains the automatic fallback — no channel,
  # previous story failed, refresh cadence, or a per-story parameters.vizdiff.forceNavigation
  # opt-out (see docs/CONFIGURATION.md "In-place story switching"). Enabled by default; set
  # false to hard-navigate every story.
  inplaceStorySwitching: true
  # -- Hard-navigate after this many consecutive in-place story switches on a session to bound
  # leaked page state (issue #474, WORKER_NAV_REFRESH_STORIES). "0" disables the cadence. Empty
  # uses the built-in default (50).
  navRefreshStories: ""
  # -- Progress watchdog (issue #452, WORKER_PROGRESS_TIMEOUT_MS): abort a build once no story
  # has completed for this many ms. "0" disables the watchdog. Empty uses the built-in default
  # (300000, 5 minutes).
  progressTimeoutMs: ""
  # -- Per-story render budget in ms used to derive the whole-build timeout ceiling when
  # buildTimeoutMs is unset (issue #452, WORKER_PER_STORY_BUDGET_MS). Empty uses the built-in
  # default (5000).
  perStoryBudgetMs: ""
  # -- Whole-build render timeout ceiling in ms (BUILD_TIMEOUT_MS). Empty derives the ceiling
  # from the discovered story count (issue #452); an explicit value is used verbatim.
  buildTimeoutMs: ""
  # -- Lower bound in ms on the derived whole-build ceiling (issue #452, BUILD_TIMEOUT_FLOOR_MS).
  # Empty uses the built-in default (900000, 15 minutes).
  buildTimeoutFloorMs: ""
  # -- How long in ms to wait for an aborted render to unwind before the worker exits so the
  # orchestrator restarts a clean process (BUILD_ABORT_GRACE_MS). Empty uses the built-in
  # default (10000).
  buildAbortGraceMs: ""
  # -- Cross-worker build sharding (issue #456, WORKER_SHARDING_ENABLED): split large builds
  # into render_story_chunk tasks that any worker replica can claim. Enabled by default; set
  # false to disable. Rolling-deploy caveat: set false BEFORE a mixed-version rollout (old and
  # new workers running side by side) — workers older than this feature fail the
  # render_story_chunk task type — and re-enable once every replica is upgraded.
  shardingEnabled: true
  # -- Stories per render chunk task when sharding is enabled (issue #456,
  # WORKER_SHARD_CHUNK_SIZE). Empty uses the built-in default (50).
  shardChunkSize: ""
  # -- Minimum discovered story count before a build is sharded; smaller builds render inline in
  # the discovery task (issue #456, WORKER_SHARD_MIN_STORIES). Empty uses the built-in default
  # (100).
  shardMinStories: ""

# Per-service container resource requests/limits.
resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  worker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  frontend:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Pre-install/pre-upgrade hook Job that waits for Postgres to accept
# connections before the api boots (the api runs migrations on boot).
dbWaitHook:
  enabled: true
  image: postgres:16-alpine

nodeSelector: {}
tolerations: []
affinity: {}
# -- Annotations applied to every pod (api, worker, frontend). To have an annotation-based
# Prometheus setup scrape the worker's metrics endpoint (issue #457; served on the health port
# next to /health), uncomment:
# podAnnotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "3003"
#   prometheus.io/path: "/metrics"
# Note these annotations are chart-global, so a scraper matching them will also probe the api and
# frontend pods (which do not listen on 3003); most annotation scrapers tolerate that, but a
# label-selector-based scrape config targeting app.kubernetes.io/component=worker is cleaner.
podAnnotations: {}
