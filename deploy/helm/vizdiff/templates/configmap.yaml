{{/*
Non-secret environment shared by api + worker via envFrom.
Secret-bearing values live in secret.yaml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vizdiff.fullname" . }}-env
  labels:
    {{- include "vizdiff.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  APP_URL: {{ .Values.appUrl | quote }}

  # --- Auth (identity) ---
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  {{- if eq .Values.auth.provider "oidc" }}
  OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ .Values.auth.oidc.redirectUri | default (printf "%s/api/auth/callback" .Values.appUrl) | quote }}
  OIDC_SCOPES: {{ .Values.auth.oidc.scopes | quote }}
  {{- end }}

  # --- VCS ---
  GITHUB_ENABLED: {{ .Values.github.enabled | quote }}
  ENABLE_VCS_STATUS: {{ .Values.enableVcsStatus | quote }}

  # --- Postgres (non-secret connection details) ---
  POSTGRES_HOST: {{ include "vizdiff.postgresHost" . | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DATABASE: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}

  # --- Object storage ---
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | quote }}
  AWS_REGION: {{ .Values.s3.region | quote }}
  {{- $endpoint := include "vizdiff.s3Endpoint" . }}
  {{- if $endpoint }}
  S3_ENDPOINT: {{ $endpoint | quote }}
  {{- end }}
  {{- if or .Values.s3.forcePathStyle .Values.s3.minio.enabled }}
  S3_FORCE_PATH_STYLE: "true"
  {{- end }}

  # --- Worker ---
  WORKER_HEALTH_PORT: "3003"
  {{- if .Values.worker.enableWebgl }}
  WORKER_ENABLE_WEBGL: "true"
  {{- end }}
  {{- with .Values.worker.chromeExtraArgs }}
  WORKER_CHROME_EXTRA_ARGS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.fatalFailsafeTimeoutMs }}
  WORKER_FATAL_FAILSAFE_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.maxTaskAttempts }}
  WORKER_MAX_TASK_ATTEMPTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.stuckRunningMinutes }}
  WORKER_STUCK_RUNNING_MINUTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.stuckPendingMinutes }}
  WORKER_STUCK_PENDING_MINUTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.storyRenderTimeoutMs }}
  WORKER_STORY_RENDER_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.storyDelayMaxMs }}
  WORKER_STORY_DELAY_MAX_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.sessionRecycleStories }}
  WORKER_SESSION_RECYCLE_STORIES: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.sessionProbeTimeoutMs }}
  WORKER_SESSION_PROBE_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.sessionMaxInfraFailures }}
  WORKER_SESSION_MAX_INFRA_FAILURES: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.storyMaxAttempts }}
  WORKER_STORY_MAX_ATTEMPTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.progressTimeoutMs }}
  WORKER_PROGRESS_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.perStoryBudgetMs }}
  WORKER_PER_STORY_BUDGET_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.buildTimeoutMs }}
  BUILD_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.buildTimeoutFloorMs }}
  BUILD_TIMEOUT_FLOOR_MS: {{ . | quote }}
  {{- end }}
  {{- with .Values.worker.buildAbortGraceMs }}
  BUILD_ABORT_GRACE_MS: {{ . | quote }}
  {{- end }}
